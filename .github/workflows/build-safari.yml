name: Build Safari macOS Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-safari:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Accept Xcode License Automatically
        run: sudo xcodebuild -license accept

      - name: Convert WebExtension to Safari macOS App
        run: |
          rm -rf /tmp/build_out
          mkdir -p /tmp/build_out
          xcrun safari-web-extension-converter \
            --project-location /tmp/build_out \
            --app-name "Tab Vault" \
            --bundle-identifier "io.github.sumana1004.tabvault" \
            --macos-only \
            --no-open \
            --no-prompt \
            .

      - name: Build Unsigned macOS App
        run: |
          PROJ_PATH=$(find /tmp/build_out -name "*.xcodeproj" | head -n 1)
          sed -i '' 's/io\.github\.sumana1004\.tabvault/io.github.sumana1004.Tab-Vault/g' "$PROJ_PATH/project.pbxproj"
          xcodebuild \
            -project "$PROJ_PATH" \
            -scheme "Tab Vault" \
            -configuration Release \
            -sdk macosx \
            -destination 'generic/platform=macOS' \
            -derivedDataPath /tmp/build_out/derived \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM=""

      - name: Package App into Zip
        run: |
          APP_PATH=$(find /tmp/build_out/derived -name "Tab Vault.app" | head -n 1)
          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"
          zip -r "$GITHUB_WORKSPACE/Tab-Vault-macOS-Safari.zip" "Tab Vault.app"

      - name: Upload Downloadable Safari App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tab-Vault-macOS-Safari
          path: Tab-Vault-macOS-Safari.zip
