name: Build Safari macOS Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-safari:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert WebExtension to Safari macOS App
        run: |
          mkdir -p build_out
          xcrun safari-web-extension-converter . \
            --project-location build_out \
            --app-name "Tab Vault" \
            --bundle-identifier "io.github.sumana1004.tabvault" \
            --macos-only \
            --no-open \
            --no-prompt

      - name: Build Unsigned macOS App
        run: |
          xcodebuild \
            -project "build_out/Tab Vault/Tab Vault.xcodeproj" \
            -scheme "Tab Vault (macOS)" \
            -configuration Release \
            -derivedDataPath build_out/derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package App into Zip
        run: |
          cd "build_out/derived/Build/Products/Release"
          zip -r "$GITHUB_WORKSPACE/Tab-Vault-macOS-Safari.zip" "Tab Vault.app"

      - name: Upload Downloadable Safari App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tab-Vault-macOS-Safari
          path: Tab-Vault-macOS-Safari.zip