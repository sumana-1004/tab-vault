<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="color-scheme" content="dark" />
		<title>Tab Vault</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<header>
			<h1 class="brand">
				<img
					src="icons/header-banner.png"
					alt="Tab Vault"
					class="header-art"
					draggable="false"
				/>
			</h1>
			<div class="actions">
				<button type="button" id="exportBtn" title="Export vault as JSON">
					Export
				</button>
				<button type="button" id="clearBtn" title="Clear unpinned tabs">
					Clear
				</button>
			</div>
		</header>

		<div class="controls">
			<input
				type="text"
				id="searchInput"
				placeholder="Search saved tabs by title or URL…"
				aria-label="Search saved tabs"
				autocomplete="off"
				spellcheck="false"
				autofocus
			/>
			<div class="tabs-filter" role="group" aria-label="Filter tabs">
				<button type="button" class="filter-btn active" data-filter="all">
					All
				</button>
				<button type="button" class="filter-btn" data-filter="pinned">
					Pinned
				</button>
			</div>
		</div>

		<main id="tabList" class="tab-list" aria-live="polite"></main>

		<footer>
			<span id="countLabel">0 tabs vaulted</span>
			<span>Cross-Browser MV3</span>
		</footer>

		<script src="popup.js"></script>
	</body>
</html>
