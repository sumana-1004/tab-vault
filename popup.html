<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tab Vault</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot"></span>
      <h1>Tab Vault</h1>
    </div>
    <div class="actions">
      <button id="exportBtn" title="Export Vault as JSON">Export</button>
      <button id="clearBtn" title="Clear unpinned tabs">Clear</button>
    </div>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search saved tabs by title or URL..." autofocus />
    <div class="tabs-filter">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pinned">Pinned</button>
    </div>
  </div>

  <div id="tabList" class="tab-list"></div>

  <footer>
    <span id="countLabel">0 tabs vaulted</span>
    <span>Cross-Browser MV3</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
